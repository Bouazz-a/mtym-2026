services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtym_jury}
      POSTGRES_USER: ${POSTGRES_USER:-mtym_jury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in jury_platform/.env}
    # Loopback only — reachable by the local backend, never from outside.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # postgres >= 18 keeps its data under /var/lib/postgresql/<major>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
